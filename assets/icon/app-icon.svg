<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Original E-4 companion mark: microphone, four voices and compact hardware.
       Matches the T-8 app's metallic enclosure; no manufacturer logos. -->
