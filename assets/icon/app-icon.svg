    <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#d3d8e0" stop-opacity=".55"/><stop offset="1" stop-color="#aab0bc" stop-opacity=".08"/></linearGradient>
    <radialGradient id="cap" cx=".36" cy=".26" r=".8"><stop stop-color="#686d77"/><stop offset=".6" stop-color="#292d35"/><stop offset="1" stop-color="#15181e"/></radialGradient>
